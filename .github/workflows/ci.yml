name: Testes

# Roda os testes e o ruff a cada envio para a main e em pull requests. Tudo offline: usa respostas reais
# gravadas e repositórios git temporários; não fala com BCB, Tesouro, IBGE nem ABAC.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar o pacote e as ferramentas de desenvolvimento
        run: python -m pip install -e ".[dev]"

      - name: Ruff (erros e formato)
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Testes
        run: python -m pytest -p no:cacheprovider
