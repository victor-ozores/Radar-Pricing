name: Testes

# Roda os testes e o ruff a cada envio para a main e em pull requests. Tudo offline: usa respostas reais
# gravadas e repositórios git temporários; não fala com BCB, Tesouro, IBGE nem ABAC.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar o pacote e as ferramentas de desenvolvimento
        run: python -m pip install -e ".[dev]"

      - name: Ruff (erros e formato)
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar as dependências do painel
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Painel (tipos, testes de contas e de telas, e a construção)
        working-directory: site
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Avisos de segurança das dependências do painel (só informa)
        working-directory: site
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Testes
        env:
          EXIGE_NODE: "1" # o painel contra o robô precisa do Node: aqui faltar é falha, não pulo
        run: python -m pytest -p no:cacheprovider
